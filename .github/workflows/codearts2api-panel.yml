# 上海时间每天 02:50 合并一次，合并成功后再点一次镜像。
# 服务器每小时第 41 分钟核对已投递镜像。不在服务器上编译。
name: codearts2api-panel

on:
  schedule:
    - cron: "50 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-sync-codearts2api-panel
  cancel-in-progress: false

jobs:
  panel:
    uses: ./.github/workflows/sync-one.yml
    secrets:
      repository: ${{ secrets.CODEARTS2API_PANEL_REPOSITORY }}
      deploy_key: ${{ secrets.CODEARTS2API_PANEL_DEPLOY_KEY }}
    with:
      git_ref: main
      upstream_slug: qwe5283/codearts2api-panel
      upstream_branch: main

  panel-image:
    needs: panel
    uses: ./.github/workflows/point-one.yml
    secrets:
      repository: ${{ secrets.CODEARTS2API_PANEL_REPOSITORY }}
      deploy_key: ${{ secrets.CODEARTS2API_PANEL_DEPLOY_KEY }}
    with:
      git_ref: main
