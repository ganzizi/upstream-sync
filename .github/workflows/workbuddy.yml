# 排在上海时间 21:10。GitHub 的 schedule 会晚大约 4 小时，实际凌晨才开始编译。
# 这样镜像能在服务器 05:30 换容器前送到。05:30 不变，每天只打包一次。
name: workbuddy

on:
  schedule:
    - cron: "10 13 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-sync-workbuddy
  cancel-in-progress: false

jobs:
  manager:
    uses: ./.github/workflows/sync-one.yml
    secrets:
      repository: ${{ secrets.MANAGER_REPOSITORY }}
      deploy_key: ${{ secrets.MANAGER_DEPLOY_KEY }}
    with:
      git_ref: main
      upstream_slug: ithtelab/workbuddy-manager
      upstream_branch: main

  api:
    uses: ./.github/workflows/sync-one.yml
    secrets:
      repository: ${{ secrets.API_REPOSITORY }}
      deploy_key: ${{ secrets.API_DEPLOY_KEY }}
    with:
      git_ref: master
      upstream_slug: HanawaBanana/workbuddy2api
      upstream_branch: master

  manager-image:
    needs: manager
    uses: ./.github/workflows/point-one.yml
    secrets:
      repository: ${{ secrets.MANAGER_REPOSITORY }}
      deploy_key: ${{ secrets.MANAGER_DEPLOY_KEY }}
    with:
      git_ref: main

  api-image:
    needs: api
    uses: ./.github/workflows/point-one.yml
    secrets:
      repository: ${{ secrets.API_REPOSITORY }}
      deploy_key: ${{ secrets.API_DEPLOY_KEY }}
    with:
      git_ref: master
