# 上海时间每天 21:25 合并一次。GitHub 的 schedule 常会推迟。
# 服务器 05:50 只核对已经送到的镜像，不在机器上编译。
name: chatgpt2api

on:
  schedule:
    - cron: "25 13 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-sync-chatgpt2api
  cancel-in-progress: false

jobs:
  sync:
    uses: ./.github/workflows/sync-one.yml
    secrets:
      repository: ${{ secrets.CHATGPT2API_REPOSITORY }}
      deploy_key: ${{ secrets.CHATGPT2API_DEPLOY_KEY }}
    with:
      git_ref: main
      upstream_slug: yukkcat/chatgpt2api
      upstream_branch: main

  image:
    needs: sync
    uses: ./.github/workflows/point-one.yml
    secrets:
      repository: ${{ secrets.CHATGPT2API_REPOSITORY }}
      deploy_key: ${{ secrets.CHATGPT2API_DEPLOY_KEY }}
    with:
      git_ref: main
