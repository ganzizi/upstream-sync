# UTC. Hourly public schedule. Private repositories are not named in this file.
name: sync-upstreams

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-upstreams
  cancel-in-progress: false

jobs:
  ithtelab:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout private fork
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.MANAGER_REPOSITORY }}
          ref: main
          ssh-key: ${{ secrets.MANAGER_DEPLOY_KEY }}
          fetch-depth: 0
          persist-credentials: true
      - name: Merge public upstream
        env:
          EXPECTED_REPO: ${{ secrets.MANAGER_REPOSITORY }}
          UPSTREAM_SLUG: ithtelab/workbuddy-manager
          UPSTREAM_BRANCH: main
        run: |
          set -euo pipefail
          origin="$(git remote get-url origin)"
          case "$origin" in
            *"$EXPECTED_REPO"*) ;;
            *) echo "origin mismatch"; exit 1 ;;
          esac
          if ! git push --dry-run origin "HEAD:${UPSTREAM_BRANCH}" >"$RUNNER_TEMP/push-dry.txt" 2>&1; then
            echo "push access failed"
            grep -v -e 'github.com' -e 'git@' "$RUNNER_TEMP/push-dry.txt" || true
            exit 1
          fi
          echo "push access ok"
          bin="${RUNNER_TEMP}/bin"
          mkdir -p "$bin"
          cat > "$bin/gh" << 'EOF'
          #!/bin/bash
          if [ "${1:-}" = "issue" ] && [ "${2:-}" = "list" ]; then
            printf '%s\n' '[]'
            exit 0
          fi
          if [ "${1:-}" = "issue" ]; then
            exit 0
          fi
          echo "unexpected gh command" >&2
          exit 1
          EOF
          chmod +x "$bin/gh"
          export PATH="$bin:$PATH"
          bash .github/sync-upstream.sh
  hanawa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout private fork
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.API_REPOSITORY }}
          ref: master
          ssh-key: ${{ secrets.API_DEPLOY_KEY }}
          fetch-depth: 0
          persist-credentials: true
      - name: Merge public upstream
        env:
          EXPECTED_REPO: ${{ secrets.API_REPOSITORY }}
          UPSTREAM_SLUG: HanawaBanana/workbuddy2api
          UPSTREAM_BRANCH: master
        run: |
          set -euo pipefail
          origin="$(git remote get-url origin)"
          case "$origin" in
            *"$EXPECTED_REPO"*) ;;
            *) echo "origin mismatch"; exit 1 ;;
          esac
          if ! git push --dry-run origin "HEAD:${UPSTREAM_BRANCH}" >"$RUNNER_TEMP/push-dry.txt" 2>&1; then
            echo "push access failed"
            grep -v -e 'github.com' -e 'git@' "$RUNNER_TEMP/push-dry.txt" || true
            exit 1
          fi
          echo "push access ok"
          bin="${RUNNER_TEMP}/bin"
          mkdir -p "$bin"
          cat > "$bin/gh" << 'EOF'
          #!/bin/bash
          if [ "${1:-}" = "issue" ] && [ "${2:-}" = "list" ]; then
            printf '%s\n' '[]'
            exit 0
          fi
          if [ "${1:-}" = "issue" ]; then
            exit 0
          fi
          echo "unexpected gh command" >&2
          exit 1
          EOF
          chmod +x "$bin/gh"
          export PATH="$bin:$PATH"
          bash .github/sync-upstream.sh
