# 上海时间每天 20:47 合并一次。私人仓库只有 push 才打包，避免一天多次编译。
name: grok-register

on:
  schedule:
    - cron: "47 12 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-sync-grok-register
  cancel-in-progress: false

jobs:
  register:
    uses: ./.github/workflows/sync-one.yml
    secrets:
      repository: ${{ secrets.GROK_REGISTER_REPOSITORY }}
      deploy_key: ${{ secrets.GROK_REGISTER_DEPLOY_KEY }}
    with:
      git_ref: main
      upstream_slug: kaibush/grok-register
      upstream_branch: main
