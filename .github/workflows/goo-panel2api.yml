# 上海时间每天 02:40 合并一次，合并成功后再点一次镜像。
# 服务器每小时第 53 分钟核对已投递镜像。不在服务器上编译。
name: goo-panel2api

on:
  schedule:
    - cron: "40 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-sync-goo-panel2api
  cancel-in-progress: false

jobs:
  panel:
    uses: ./.github/workflows/sync-one.yml
    secrets:
      repository: ${{ secrets.GOO_PANEL2API_REPOSITORY }}
      deploy_key: ${{ secrets.GOO_PANEL2API_DEPLOY_KEY }}
    with:
      git_ref: main
      upstream_slug: xu20060420fan-cell/workbuddy2api-trae-qoder-minimax-panel
      upstream_branch: main

  panel-image:
    needs: panel
    uses: ./.github/workflows/point-one.yml
    secrets:
      repository: ${{ secrets.GOO_PANEL2API_REPOSITORY }}
      deploy_key: ${{ secrets.GOO_PANEL2API_DEPLOY_KEY }}
    with:
      git_ref: main
